plugins {
    id 'com.android.application'
}

android {
    namespace 'es.mitgcf.app'
    compileSdk 36

    defaultConfig {
        applicationId "es.mitgcf.app"
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName "1.0.2"
    }

    signingConfigs {
        release {
            def ks = System.getenv("KEYSTORE_FILE")
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv("KEYSTORE_FILE") != null && !System.getenv("KEYSTORE_FILE").isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/*.version', 'DebugProbesKt.bin', 'kotlin-tooling-metadata.json']
        }
    }
}

dependencies {
    // La facturación arrastra una versión antigua de la librería de Kotlin y AndroidX otra más nueva.
    // El BOM las alinea y evita que aparezcan clases duplicadas al empaquetar.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.android.billingclient:billing:7.1.1'
}
