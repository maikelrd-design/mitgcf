<style>
:root{
  --navy:#16255c; --navy2:#22357a; --navy3:#0f1a42;
  --bg:#0e1738; --bg2:#152250; --card:#1b2a60; --card2:#24356f; --line:#324681;
  --txt:#eef2fb; --dim:#a4b3dc; --acc:#f0c04a; --acc2:#ffd873;
  --ok:#37b57a; --bad:#e05a4d; --warn:#e8a83c;
  --shadow:0 6px 20px #0006;
}
html[data-theme="light"]{
  --bg:#eef1f8; --bg2:#ffffff; --card:#ffffff; --card2:#f3f6fd; --line:#ccd6ee;
  --txt:#111c40; --dim:#5c6d99; --acc:#16255c; --acc2:#22357a;
  --ok:#1d8a56; --bad:#c2382c; --warn:#b57611;
  --shadow:0 3px 12px #16255c1f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:40px}
h1,h2,h3{margin:0;font-weight:700}
svg{display:block}
header{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,var(--navy3),var(--navy2));
  color:#fff;padding:11px 13px 9px;box-shadow:var(--shadow)}
.hrow{display:flex;align-items:center;gap:11px}
.logo{width:42px;height:42px;flex:0 0 42px}
.hrow h1{font-size:16.5px;letter-spacing:.2px;line-height:1.15}
.hrow small{display:block;color:#c3cef0;font-weight:500;font-size:11px;margin-top:2px}
.themebtn{margin-left:auto;flex:0 0 auto;width:38px;height:38px;border-radius:11px;border:1px solid #ffffff33;
  background:#ffffff1a;color:#fff;display:grid;place-items:center;font-size:16px}
.tabs{display:flex;gap:5px;margin-top:10px;background:#00000026;padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:9px 10px;border:0;background:transparent;color:#c3cef0;
  border-radius:9px;font-size:12.5px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--navy)}
main{padding:13px;max-width:880px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:13px;box-shadow:var(--shadow)}
.card>h2{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:11px;
  display:flex;align-items:center;gap:7px}
.card>h2 .num{width:19px;height:19px;border-radius:6px;background:var(--acc);color:var(--navy3);
  display:grid;place-items:center;font-size:11px;font-weight:800;flex:0 0 19px}
html[data-theme="light"] .card>h2 .num{color:#fff}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
label{display:block;font-size:10.5px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);background:var(--bg2);color:var(--txt);
  border-radius:10px;font-size:15px;font-family:inherit}
input[readonly]{background:transparent;color:var(--dim)}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=range]{-webkit-appearance:none;appearance:none;padding:0;height:30px;background:transparent;border:0}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:99px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;
  background:var(--acc);border:3px solid var(--bg2);box-shadow:var(--shadow)}
input[type=range]::-moz-range-track{height:7px;border-radius:99px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--acc);border:3px solid var(--bg2)}
input[type=checkbox]{width:auto;padding:0}
button{cursor:pointer;font-family:inherit}
.btn{padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card2);
  color:var(--txt);font-weight:650;font-size:14px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--navy3)}
html[data-theme="light"] .btn.p{color:#fff}
.btn.d{background:transparent;border-color:#7e3a33;color:#e79c93}
html[data-theme="light"] .btn.d{border-color:#e0b4ae;color:#a53125}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:active{transform:translateY(1px)}
.hint{font-size:11.5px;color:var(--dim);margin-top:7px;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hidden{display:none!important}
.pruebas{display:grid;gap:10px}
@media(min-width:680px){.pruebas{grid-template-columns:1fr 1fr}}
.pr{border:1px solid var(--line);border-radius:14px;background:var(--bg2);overflow:hidden}
.pr .head{display:flex;align-items:center;gap:11px;padding:11px 12px}
.pr .ico{width:42px;height:42px;flex:0 0 42px;border-radius:12px;background:linear-gradient(135deg,var(--navy2),var(--navy));
  color:#fff;display:grid;place-items:center;padding:6px}
.pr .ico svg{width:100%;height:100%}
.pr .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.pr .cual{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.pr .chip{margin-left:auto;flex:0 0 auto;text-align:center;min-width:56px}
.pr .chip b{display:block;font-variant-numeric:tabular-nums;font-weight:800;font-size:21px;color:var(--acc2);line-height:1}
html[data-theme="light"] .pr .chip b{color:var(--navy2)}
.pr .chip b.no{color:var(--bad)}
.pr .chip span{font-size:9.5px;color:var(--dim);letter-spacing:.7px;font-weight:700}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 12px}

/* ==================================================================
   PLANES DE ENTRENAMIENTO
   Marco metodológico:
   · Resistencia — métodos continuos e interválicos y sus parámetros de carga
     (Navarro; García Manso, Casado y Navarro, Máster COE). Distribución de
     intensidades con 70-80 % del volumen por debajo del primer umbral y
     evolución de piramidal a polarizado (Stöggl y Sperlich; Seiler).
   · Ritmos derivados de la VAM estimada desde la marca de 2.000 m
     (vVO2max sostenible 4-8 min; test progresivo VAM = Vmáx − 8 %).
   · Fuerza — carácter del esfuerzo X(Y): repeticiones realizadas sobre las
     realizables, sin llegar nunca al fallo, máxima velocidad de ejecución
     intencionada y recuperaciones completas (González-Badillo y Gorostiaga;
     González-Badillo y Sánchez-Medina).
   · Entrenamiento concurrente — fuerza antes que resistencia, separación de
     sesiones, series de 6-8 repeticiones cuando la resistencia va a umbral y
     de 2-4 cuando va por encima, nunca con carácter del esfuerzo máximo.
   · Velocidad y cambios de dirección — series de unos 10 s a intensidad
     máxima con recuperación completa y estímulo visual; arrastres de 20-30 m

/* ---------------- motor ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pr = id => CFG.pruebas.find(p=>p.id===id);
const activas = () => CFG.pruebas.filter(p=>p.activa);

function tramoDe(edad){ edad=+edad||0;
  for(const t of CFG.tramos) if(edad<=t.max) return t.lbl;
  return CFG.tramos[CFG.tramos.length-1].lbl; }
function clavesDe(p){
  const tab = p.sinSexo ? (p.tabla[CFG.tramos[0].lbl]||Object.values(p.tabla)[0]||{})
                        : ((p.tabla.M||{})[CFG.tramos[0].lbl]||Object.values(p.tabla.M||{})[0]||{});
  const ks = Object.keys(tab).map(Number).filter(n=>!isNaN(n));
  ks.sort((a,b)=> p.mejor==='mas' ? b-a : a-b);
  return ks; }
const claveTxt = (p,k) => p.unidad==='segundos' ? k.toFixed(1) : String(k);
const tablaDe = (p,sexo,tramo) => p.sinSexo ? p.tabla[tramo] : (p.tabla[sexo]||{})[tramo];
function aplicable(p, edad, sexo){
  if(!p.activa) return false;
  if(p.edadMaxima!==null && p.edadMaxima!==undefined && (+edad||0) > p.edadMaxima) return false;
  return !!tablaDe(p, sexo, tramoDe(edad)); }
function normaliza(p, marca){
  if(marca===null||marca===undefined||isNaN(marca)) return null;
  return p.unidad==='segundos' ? Math.floor(marca*10+1e-6)/10 : Math.floor(marca); }
function puntos(p, marca, sexo, edad){
  const m=normaliza(p,marca); if(m===null) return null;
  const tab=tablaDe(p,sexo,tramoDe(edad)); if(!tab) return null;
  const ks=clavesDe(p); if(!ks.length) return null;
  const v=k=>tab[claveTxt(p,k)];
  if(p.mejor==='mas'){ if(m>=ks[0]) return v(ks[0]); for(const k of ks) if(m>=k) return v(k); return 0; }
  if(m<=ks[0]) return v(ks[0]);
  let out=0; for(const k of ks){ if(m>=k) out=v(k); else break; }
  return out; }
function ajuste(p, marca){
  const m=normaliza(p,marca); if(m===null) return '';
  const ks=clavesDe(p); if(!ks.length) return '';
  if(p.unidad==='reps') return (m>=ks[0]?'≥'+ks[0]:m)+' rep';
  if(p.unidad==='segundos'){ if(m<=ks[0]) return '≤'+dec1(ks[0])+' s';
    let o=null; for(const k of ks){ if(m>=k) o=k; else break; } return o===null?'':dec1(o)+' s'; }
  if(p.mejor==='mas'){ if(m>=ks[0]) return '≥'+fmtT(ks[0]); for(const k of ks) if(m>=k) return fmtT(k); return '<'+fmtT(ks[ks.length-1]); }
  if(m<=ks[0]) return '≤'+fmtT(ks[0]);
  let o=null; for(const k of ks){ if(m>=k) o=k; else break; } return o===null?'':fmtT(o); }
const nivel = pts => pts===null?null:Math.min(10,Math.floor(pts/CFG.escala));

/* marca mínima necesaria para alcanzar unos puntos dados */
function marcaPara(p, objetivo, sexo, edad){
  const tab=tablaDe(p,sexo,tramoDe(edad)); if(!tab) return null;
  const ks=clavesDe(p);                       // de la mejor marca a la peor
  let out=null;
  for(let i=ks.length-1;i>=0;i--){ if(tab[claveTxt(p,ks[i])] >= objetivo){ out=ks[i]; break; } }
  return out; }

function evaluar(reg){
  const {sexo,edad}=reg;
  const usadas = CFG.pruebas.filter(p=>aplicable(p,edad,sexo));
  const pts={};
  for(const p of CFG.pruebas) pts[p.id] = aplicable(p,edad,sexo) ? puntos(p, reg.marcas[p.id], sexo, edad) : null;
  const completo = usadas.length>0 && usadas.every(p=>pts[p.id]!==null);
  let nota=null, perfil=null, etiquetas=[], apto=null, fallos=[];
  if(completo){
    for(const c of CFG.cualidades){
      const ps=usadas.filter(p=>p.cualidad===c.id).map(p=>pts[p.id]);
      if(!ps.length) continue;
      perfil=perfil||[]; perfil.push(nivel(ps.reduce((a,b)=>a+b,0)/ps.length)); etiquetas.push(c.nombre);
    }
    const media = usadas.reduce((a,p)=>a+pts[p.id],0)/usadas.length/CFG.escala;
    const f=Math.pow(10,CFG.decimales);
    nota = CFG.redondeo==='redondear' ? Math.round(media*f)/f : Math.floor(media*f+1e-9)/f;
    fallos = usadas.filter(p=>pts[p.id]<CFG.minPuntos);
    apto = fallos.length===0;
  }
  return {pts,nota,perfil,etiquetas,apto,completo,usadas,fallos}; }

/* ---------------- formato ---------------- */
function fmtT(s){ s=Math.max(0,Math.floor(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function fmtT2(s){ s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function fmtDec(ms){ const t=Math.max(0,ms),m=Math.floor(t/60000),s=Math.floor(t%60000/1000),d=Math.floor(t%1000/100);
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+','+d; }
const dec1 = v => (Math.round(v*10)/10).toFixed(1).replace('.',',');
const notaTxt = n => n===null||n===undefined?'—':n.toFixed(CFG.decimales).replace('.',',');
function parseMarca(p, txt){
  if(txt===null||txt===undefined) return null;
  txt=String(txt).trim().replace(',','.'); if(!txt) return null;
  if(p.unidad==='reps'){ const n=parseInt(txt,10); return isNaN(n)?null:Math.max(0,n); }
  if(p.unidad==='segundos'){ const n=parseFloat(txt); return isNaN(n)?null:Math.max(0,n); }
  if(txt.includes(':')){ const a=txt.split(':'),m=parseInt(a[0],10),s=parseFloat(a[1]);
    return (isNaN(m)||isNaN(s))?null:m*60+s; }
  const n=parseFloat(txt); return isNaN(n)?null:n; }
function marcaTxt(p,v){ if(v===null||v===undefined||isNaN(v)) return '';
  if(p.unidad==='reps') return String(v);
  if(p.unidad==='segundos') return dec1(v);
  return fmtT(v); }
const marcaPH  = p => p.unidad==='reps'?'42':(p.unidad==='segundos'?'13,4':(p.mejor==='mas'?'3:20':'9:36'));
const marcaLbl = p => p.unidad==='reps'?'Repeticiones':(p.unidad==='segundos'?'Segundos':'Tiempo (m:ss)');
const nombreCualidad = id => (CFG.cualidades.find(c=>c.id===id)||{nombre:id}).nombre;
const cuentaCualidad = id => CFG.pruebas.filter(p=>p.activa&&p.cualidad===id).length;
const hoyISO = () => new Date().toISOString().slice(0,10);
/* La edad del TGCF es la que se cumple durante el año natural en curso:
   el año en que se cumplen 45 ya no se realiza la prueba de velocidad. */
const anioActual = () => new Date().getFullYear();
const edadDeAnio = a => { a=parseInt(a,10); return (a>1900 && a<=anioActual()) ? anioActual()-a : null; };
const anioDeEdad = e => anioActual()-(+e||0);
const fechaCorta = iso => { if(!iso) return ''; const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0].slice(2); };

/* ---------------- cronómetros ---------------- */
function nuevoCrono(){ return {acc:0,run:false,t0:0,timer:null,taps:0,laps:[]}; }
const cronoMs = c => c.acc + (c.run?Date.now()-c.t0:0);
function cronoStop(c){ if(c.run){ c.acc=cronoMs(c); c.run=false; } clearInterval(c.timer); c.timer=null; }
function cronoStart(c,tick){ if(c.run) return; c.t0=Date.now(); c.run=true; c.timer=setInterval(tick,87); }
function cronoZero(c){ cronoStop(c); c.acc=0; c.taps=0; c.laps=[]; }
const msVista = (p,c) => p.limite>0 ? Math.max(0, p.limite*1000-cronoMs(c)) : cronoMs(c);
const textoCrono = (p,ms) => p.unidad==='segundos' ? fmtDec(ms) : fmtT2(ms/1000);
function valorCrono(p,c){
  if(p.unidad==='reps') return c.taps;
  const ms=cronoMs(c), usado = p.limite>0?Math.min(ms,p.limite*1000):ms;
  return p.unidad==='segundos' ? Math.floor(usado/100)/10 : Math.floor(usado/1000); }
function mejorDe(p,ant,nueva){
  if(ant===null||ant===undefined||isNaN(ant)) return nueva;
  if(p.intentos<=1) return nueva;
  return p.mejor==='mas' ? Math.max(ant,nueva) : Math.min(ant,nueva); }

/* ---- pruebas ---- */
function secPruebas(){

    <div class="pr" style="margin-bottom:10px">
      <div class="head">

        </div>

          <div><label>Cualidad</label><select data-cfg="pruebas.${i}.cualidad">

          <div><label>Unidad</label><select data-cfg="pruebas.${i}.unidad">
            <option value="reps"${p.unidad==='reps'?' selected':''}>Repeticiones</option>

            <option value="segundos"${p.unidad==='segundos'?' selected':''}>Segundos con décima</option></select></div>
          <div><label>Mejor marca</label><select data-cfg="pruebas.${i}.mejor">
            <option value="mas"${p.mejor==='mas'?' selected':''}>La mayor</option>
            <option value="menos"${p.mejor==='menos'?' selected':''}>La menor</option></select></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div><label>Intentos</label><input type="number" min="1" max="5" data-cfg="pruebas.${i}.intentos" data-num="1" value="${p.intentos}"></div>
          <div><label>Límite de tiempo (s)</label><input type="number" min="0" max="3600" data-cfg="pruebas.${i}.limite" data-num="1" value="${p.limite}"></div>
          <div><label>Edad máxima que la realiza</label><input type="number" min="0" max="99" placeholder="sin límite"
            value="${p.edadMaxima===null||p.edadMaxima===undefined?'':p.edadMaxima}" onchange="setEdadMax(${i},this.value)"></div>
        </div>
        <div class="row" style="margin-top:8px">
          <div><label>Distingue sexo</label><select onchange="setSinSexo(${i},this.value)">
            <option value="0"${!p.sinSexo?' selected':''}>Sí, tablas M y F</option>
            <option value="1"${p.sinSexo?' selected':''}>No, tabla única</option></select></div>
          <div style="flex:2"><label>Texto de ayuda</label><input data-cfg="pruebas.${i}.ayuda" value="${esc(p.ayuda||'')}"></div>
        </div>
      </div>
    </div>`).join('')}

      con 44 quedan fuera los que cumplen 45 o más este año. Al pasar a tabla única se conserva la de hombres; al pasar a M/F se duplica la existente.
      Desactivar una prueba la excluye del cálculo de nota y perfil.</div>
  </div>`;
}
function setEdadMax(i,val){ const v=String(val).trim();
  CFG.pruebas[i].edadMaxima = v===''?null:(+v||0); guardaCFG(); pintaAdminBody(); }
function setSinSexo(i,val){
  const p=CFG.pruebas[i], unica = val==='1';
  if(unica === !!p.sinSexo) return;
  if(unica){ p.tabla=clone(p.tabla.M||{}); p.sinSexo=true; }
  else { const t=clone(p.tabla); p.tabla={M:t,F:clone(t)}; p.sinSexo=false; }
  guardaCFG(); pintaAdminBody(); }

/* ---- tramos ---- */
function tramosDe(p){
  const cl = p.sinSexo ? Object.keys(p.tabla) : Object.keys(p.tabla.M||{});
  return CFG.tramos.map(t=>t.lbl).filter(l=>cl.includes(l)); }
function secTramos(){
  return `<div class="card"><h2><span class="num">1</span>Tramos de edad</h2>
    <table class="adm"><thead><tr><th>#</th><th>Etiqueta</th><th>Edad máxima</th><th>Rango</th><th></th></tr></thead><tbody>
    ${CFG.tramos.map((t,i)=>{ const desde=i===0?0:CFG.tramos[i-1].max+1;
      return `<tr><td>${i+1}</td>
        <td><input value="${esc(t.lbl)}" onchange="renTramo(${i},this.value)"></td>
        <td style="width:104px"><input type="number" min="1" max="200" value="${t.max}" onchange="maxTramo(${i},this.value)"></td>
        <td>${desde}–${t.max>=120?'∞':t.max}</td>
        <td><button class="btn d sm" onclick="delTramo(${i})">×</button></td></tr>`; }).join('')}
    </tbody></table>
    <div class="row" style="margin-top:11px"><button class="btn" onclick="addTramo()">+ Añadir tramo</button></div>
    <div class="hint">La etiqueta identifica las columnas de los baremos: al renombrarla se renombra en todas las tablas.
      Al añadir un tramo se copian los puntos del último.</div>
  </div>`;
}
function paraCadaTabla(fn){
  for(const p of CFG.pruebas){
    if(p.sinSexo) fn(p.tabla);
    else for(const s of Object.keys(p.tabla)) fn(p.tabla[s]);
  } }
function renTramo(i,val){
  const nuevo=String(val).trim(); if(!nuevo) return pintaAdminBody();
  const viejo=CFG.tramos[i].lbl; if(nuevo===viejo) return;
  if(CFG.tramos.some((t,j)=>j!==i&&t.lbl===nuevo)){ alert('Ya existe un tramo con esa etiqueta.'); return pintaAdminBody(); }
  paraCadaTabla(t=>{ if(t[viejo]!==undefined){ t[nuevo]=t[viejo]; delete t[viejo]; } });
  CFG.tramos[i].lbl=nuevo; guardaCFG(); pintaAdminBody(); }
function maxTramo(i,val){ CFG.tramos[i].max=+val||0; guardaCFG(); pintaAdminBody(); }
function addTramo(){
  const u=CFG.tramos[CFG.tramos.length-1];
  let lbl=u.lbl+' bis', n=2; while(CFG.tramos.some(t=>t.lbl===lbl)) lbl=u.lbl+' ('+(n++)+')';
  paraCadaTabla(t=>{ if(t[u.lbl]) t[lbl]=clone(t[u.lbl]); });
  CFG.tramos.push({lbl,max:Math.min(200,u.max+5)}); guardaCFG(); pintaAdminBody(); }
function delTramo(i){
  if(CFG.tramos.length<=1){ alert('Debe quedar al menos un tramo.'); return; }
  const t=CFG.tramos[i];
  if(!confirm('¿Eliminar el tramo '+t.lbl+' y sus columnas de puntos?')) return;
  paraCadaTabla(tab=>{ delete tab[t.lbl]; });
  CFG.tramos.splice(i,1); guardaCFG(); pintaAdminBody(); }

/* ---- baremos ---- */
const valorClaveTxt = (p,k) => p.unidad==='reps'?String(k):(p.unidad==='segundos'?dec1(k):fmtT(k));
function secBaremos(){
  if(!CFG.pruebas.length) return '<div class="card"><div class="empty">No hay pruebas.</div></div>';
  if(!aSel.pid||!pr(aSel.pid)) aSel.pid=CFG.pruebas[0].id;
  const p=pr(aSel.pid);
  const trs=tramosDe(p).length?tramosDe(p):CFG.tramos.map(t=>t.lbl);
  if(!trs.includes(aSel.tramo)) aSel.tramo=trs[0];
  const ks=clavesDe(p), tab=tablaDe(p,aSel.sexo,aSel.tramo)||{};
  return `<div class="card"><h2><span class="num">1</span>Editar baremo</h2>
    <div class="row">
      <div style="flex:1.6"><label>Prueba</label><select id="bP">${CFG.pruebas.map(x=>`<option value="${x.id}"${x.id===p.id?' selected':''}>${esc(x.nombre)}</option>`).join('')}</select></div>
      <div style="flex:.5"><label>Sexo</label><select id="bS" ${p.sinSexo?'disabled':''}>
        <option value="M"${aSel.sexo==='M'?' selected':''}>M</option><option value="F"${aSel.sexo==='F'?' selected':''}>F</option></select></div>
      <div style="flex:.8"><label>Tramo</label><select id="bT">${trs.map(l=>`<option${l===aSel.tramo?' selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="addFila()">+ Añadir marca</button>
      <button class="btn d" onclick="restaurarTabla()">Restaurar esta prueba</button>
    </div>
    <div class="hint">La <b>marca</b> es común a todos los tramos y sexos de la prueba; los <b>puntos</b> son los de esta columna.</div>
    <div class="scroll" style="margin-top:11px;max-height:56vh;overflow-y:auto">
      <table class="adm"><thead><tr><th>Marca</th><th>Puntos</th><th>Nivel</th><th></th></tr></thead><tbody>
      ${ks.map(k=>`<tr>
        <td style="width:118px"><input value="${valorClaveTxt(p,k)}" data-k="${claveTxt(p,k)}" class="bk"></td>
        <td style="width:96px"><input type="number" min="0" max="100" value="${tab[claveTxt(p,k)]??0}" data-k="${claveTxt(p,k)}" class="bv"></td>
        <td class="n">${Math.min(10,Math.floor((tab[claveTxt(p,k)]??0)/CFG.escala))}</td>
        <td><button class="btn d sm" onclick="delFila('${claveTxt(p,k)}')">×</button></td></tr>`).join('')}
      </tbody></table></div>
    <div class="hint">${ks.length} filas.</div>
  </div>`;
}
function bindBaremos(){
  const p=pr(aSel.pid);
  $('bP').onchange=e=>{ aSel.pid=e.target.value; aSel.tramo=null; pintaAdminBody(); };
  $('bS').onchange=e=>{ aSel.sexo=e.target.value; pintaAdminBody(); };
  $('bT').onchange=e=>{ aSel.tramo=e.target.value; pintaAdminBody(); };
  document.querySelectorAll('#aBody .bv').forEach(inp=>{ inp.onchange=()=>{
    const tab=tablaDe(p,aSel.sexo,aSel.tramo); if(!tab) return;
    tab[inp.dataset.k]=Math.max(0,Math.min(100,+inp.value||0)); guardaCFG(); pintaAdminBody(); }; });
  document.querySelectorAll('#aBody .bk').forEach(inp=>{ inp.onchange=()=>renombraClave(p,inp.dataset.k,inp.value); });
}
function tablasDe(p){ const t=[];
  if(p.sinSexo) Object.values(p.tabla).forEach(x=>t.push(x));
  else Object.values(p.tabla).forEach(s=>Object.values(s).forEach(x=>t.push(x)));
  return t; }
function claveDesdeTxt(p,txt){ const v=parseMarca(p,txt); if(v===null) return null;
  return p.unidad==='segundos' ? (Math.round(v*10)/10).toFixed(1) : String(Math.floor(v)); }
function renombraClave(p,vieja,txt){
  const nueva=claveDesdeTxt(p,txt);
  if(nueva===null){ alert('Marca no válida.'); return pintaAdminBody(); }
  if(nueva===vieja) return;
  const tabs=tablasDe(p);
  if(tabs.some(t=>t[nueva]!==undefined)){ alert('Ya existe una fila con esa marca.'); return pintaAdminBody(); }
  tabs.forEach(t=>{ if(t[vieja]!==undefined){ t[nueva]=t[vieja]; delete t[vieja]; } });
  guardaCFG(); pintaAdminBody(); }
function addFila(){
  const p=pr(aSel.pid);
  const txt=prompt('Marca de la nueva fila'+(p.unidad==='reps'?' (repeticiones)':(p.unidad==='segundos'?' (segundos, p. ej. 13,4)':' (m:ss)'))+':');
  if(txt===null) return;
  const k=claveDesdeTxt(p,txt); if(k===null){ alert('Marca no válida.'); return; }
  const tabs=tablasDe(p);
  if(tabs.some(t=>t[k]!==undefined)){ alert('Ya existe una fila con esa marca.'); return; }
  tabs.forEach(t=>{ t[k]=0; }); guardaCFG(); pintaAdminBody(); }
function delFila(k){
  const p=pr(aSel.pid);
  if(!confirm('¿Eliminar la fila '+valorClaveTxt(p,+k)+' en todos los tramos de esta prueba?')) return;
  tablasDe(p).forEach(t=>delete t[k]); guardaCFG(); pintaAdminBody(); }
function restaurarTabla(){
  const p=pr(aSel.pid), d=defaults().pruebas.find(x=>x.id===p.id);
  if(!d){ alert('Esta prueba no tiene valores de fábrica.'); return; }
  if(!confirm('¿Restaurar el baremo por defecto de «'+p.nombre+'»?')) return;
  p.tabla=clone(d.tabla); p.sinSexo=d.sinSexo; guardaCFG(); pintaAdminBody(); }

const edadValida = e => { e=parseInt(e,10); return !isNaN(e) && e>=CFG.edadMinima && e<=CFG.edadMaxima; };
function aplicaEdad(v){ yo.edad = edadValida(v) ? parseInt(v,10) : 0; guardaYo(); }

function bindDatos(repinta){
  $('yNom').oninput=e=>{ yo.nom=e.target.value; guardaYo(); };
  $('ySexo').onchange=e=>{ yo.sexo=e.target.value; guardaYo(); repinta(); };

  /* La edad NO repinta mientras se escribe. Si lo hiciera, al teclear el primer dígito
     se reconstruiría el campo, se perdería el foco y sería imposible escribir el segundo.
     Se aplica al salir del campo o al pulsar Intro. */
  const ed=$('yEdad');
  ed.oninput = ()=>{ yo.anio=''; const a=$('yAnio'); if(a) a.value=''; };
  ed.onblur   = ()=>{ aplicaEdad(ed.value); repinta(); };
  ed.onkeydown= e=>{ if(e.key==='Enter'){ e.preventDefault(); ed.blur(); } };

  const an=$('yAnio');
  an.oninput  = e=>{ yo.anio=e.target.value.trim(); };
  an.onblur   = e=>{ const v=e.target.value.trim(), x=edadDeAnio(v);
                     yo.anio=v; if(x!==null) aplicaEdad(x); guardaYo(); repinta(); };
  an.onkeydown= e=>{ if(e.key==='Enter'){ e.preventDefault(); an.blur(); } };
}

function guardaSesion(){

/* cronómetros */
function reloj(p){
  const el=$('rl_'+p.id); if(!el) return;
  const c=ck(p.id); let ms=msVista(p,c);
  if(p.limite>0&&ms<=0&&c.run){ cronoStop(c); const b=$('go_'+p.id); if(b) b.textContent='Iniciar'; ms=0; }
  el.textContent=textoCrono(p,ms);
  el.className='clock'+(c.run?' run':'')+((p.limite>0&&ms<=10000)?' fin':'');
}
function ckToggle(pid){ const p=pr(pid),c=ck(pid),b=$('go_'+pid);
  if(c.run){ cronoStop(c); if(b) b.textContent='Continuar'; } else { cronoStart(c,()=>reloj(p)); if(b) b.textContent='Parar'; }
  reloj(p); }
function ckReset(pid){ const p=pr(pid),c=ck(pid); cronoZero(c);
  const b=$('go_'+pid); if(b) b.textContent='Iniciar';
  const t=$('tp_'+pid); if(t) t.textContent='0'; reloj(p); }
function ckTap(pid){ const p=pr(pid),c=ck(pid);
  if(!c.run&&cronoMs(c)===0) cronoStart(c,()=>reloj(p));
  if(p.limite>0&&msVista(p,c)<=0) return;
  c.taps++; const t=$('tp_'+pid); if(t) t.textContent=c.taps; }
function ckSave(pid){ const p=pr(pid),c=ck(pid); cronoStop(c);
  const b=$('go_'+pid); if(b) b.textContent='Continuar';
  yo.marcas[pid]=mejorDe(p,yo.marcas[pid],valorCrono(p,c)); guardaYo();
  const ab=$('ck_'+pid)&&$('ck_'+pid).open; vistaTest();
  if(ab){ const d=$('ck_'+pid); if(d) d.open=true; } }

function ritmoTxt(segKm){ segKm=Math.max(120,Math.round(segKm));
  return Math.floor(segKm/60)+':'+String(segKm%60).padStart(2,'0')+'/km'; }
function nivelPlan(){
  const r=evaluar(yo), pl=CFG.plan;
  if(planCfg.nivel && planCfg.nivel!=='auto'){ const n=pl.niveles.find(x=>x.id===planCfg.nivel); if(n) return n; }
  const n=r.completo?r.nota:0;
  let out=pl.niveles[0];
  for(const x of pl.niveles) if(n>=x.desde) out=x;
  return out;
}
/* punto débil: cualidad con menos puntos respecto a las demás */
function puntoDebil(){
  const r=evaluar(yo); if(!r.completo) return null;
  const med={};
  for(const c of CFG.cualidades){
    const ps=r.usadas.filter(p=>p.cualidad===c.id).map(p=>r.pts[p.id]);
    if(ps.length) med[c.id]=ps.reduce((a,b)=>a+b,0)/ps.length;
  }
  const ids=Object.keys(med); if(ids.length<2) return null;
  ids.sort((a,b)=>med[a]-med[b]);
  const dif=med[ids[ids.length-1]]-med[ids[0]];
  return dif>=15 ? ids[0] : null;
}
function recomiendaPlan(){
  const r=evaluar(yo);
  if(r.completo && r.apto===false) return 'apto';
  const deb=puntoDebil();
  if(deb && CFG.planes.some(p=>p.enfasis===deb)) return CFG.planes.find(p=>p.enfasis===deb).id;
  if(obj.modo==='apto') return 'apto';
  if(obj.nota>=7.5) return 'alto';
  const n = r.completo?r.nota:0;
  if(n>=7) return 'alto';
  if(n<5) return 'apto';
  return 'nota';
}
function planActivo(){
  const rec=recomiendaPlan();
  const id = (!planCfg.planId||planCfg.planId==='auto') ? rec : planCfg.planId;
  return CFG.planes.find(p=>p.id===id) || CFG.planes.find(p=>p.id===rec) || CFG.planes[0];
}
function datosPlan(){
  const r=evaluar(yo), pl=CFG.plan;
  const objPts = obj.modo==='apto'?CFG.minPuntos:Math.ceil(obj.nota*CFG.escala);
  const pFlex=pr('flexiones'), pPl=pr('plancha'), pCar=pr('carrera'), pCav=pr('cav');
  const flexMax = normaliza(pFlex, yo.marcas.flexiones) || 12;
  const planMax = normaliza(pPl, yo.marcas.plancha) || 60;
  const t2000Act = normaliza(pCar, yo.marcas.carrera) || 660;
  let t2000Obj = pCar?marcaPara(pCar,objPts,yo.sexo,yo.edad):null;
  if(t2000Obj===null||t2000Obj>t2000Act) t2000Obj = Math.round(t2000Act*0.95);
  const cavAct = pCav?normaliza(pCav, yo.marcas.cav):null;
  /* VAM: medida en test si el usuario la ha introducido, o estimada desde la
     marca de 2.000 m corrigiendo por la fracción de VAM sostenible en ese tiempo */
  let fr=0.94; for(const [t,v] of pl.fraccionVAM){ if(t2000Act<=t){ fr=v; break; } }
  let vam = (2000/t2000Act)/fr;            // m/s · estimada
  let origen = 'estimada';
  const V = planCfg.vam||{};
  const medida = vamMedida(V);
  if(medida){ vam = medida.vam; origen = medida.origen; }
  const fcmax = (+planCfg.fcmax||0) > 100 ? +planCfg.fcmax
              : Math.round(pl.fcmax.a - pl.fcmax.b*(+yo.edad||30));
  const fcOrigen = (+planCfg.fcmax||0) > 100 ? 'medida' : 'estimada';
  const mejora = (t2000Act-t2000Obj)/t2000Act;
  return {r, nivel:nivelPlan(), flexMax, planMax, t2000Act, t2000Obj, cavAct,
          vam, fr, origen, fcmax, fcOrigen, mejora,
          ritmoObj:t2000Obj/2, ritmoVAM:1000/vam, objPts};
}
/* conversión de los test de campo a VAM en m/s */
function vamMedida(V){
  if(!V.modo || V.modo==='estimada') return null;
  const raw = String(V.valor??'').trim(); if(!raw) return null;
  if(V.modo==='t1000'){
    let t;
    if(raw.includes(':')){ const a=raw.split(':'); t=(parseInt(a[0],10)||0)*60+parseFloat(String(a[1]).replace(',','.')); }
    else t=parseFloat(raw.replace(',','.'));
    if(!isFinite(t) || t<120 || t>900) return null;      // entre 2 y 15 min
    return {vam:(1000/t)/1.02, origen:'test de 1.000 m ('+fmtT(t)+')'};
  }
  const n = parseFloat(raw.replace(',','.'));
  if(!isFinite(n) || n<=0) return null;
  if(V.modo==='kmh')     return (n>=6 && n<=26)     ? {vam:n/3.6,          origen:'medida directamente ('+dec1(n)+' km/h)'} : null;
  if(V.modo==='test6')   return (n>=600 && n<=3000) ? {vam:n/360,          origen:'test de 6 min ('+Math.round(n)+' m)'}    : null;
  if(V.modo==='navette') return (n>=1 && n<=18)     ? {vam:(8+0.5*n)/3.6,  origen:'Course Navette (palier '+dec1(n)+')'}    : null;
  return null;
}

/* ritmo (s/km) a un porcentaje de la VAM */
const ritmoPct = (d,p) => 1000/(d.vam*p);
function rango(d, z){
  const [a,b]=CFG.plan.zonas[z];
  const r1=ritmoTxt(ritmoPct(d,b)), r2=ritmoTxt(ritmoPct(d,a));
  return r1===r2?r1:r1+'–'+r2;
}
const pctFC = (d,p) => Math.round(d.fcmax*p);

    const it=[['Calentamiento 12 min en zona 1 y 4 progresivos de 60 m.','calent']];
    if(s.z2) it.push([`Continuo intensivo: <b>${s.z2} min</b> a ritmo de umbral <b>${rango(d,'z2')}</b>
      (${pctFC(d,0.84)}–${pctFC(d,0.88)} lpm, RPE 13-14 de 20). Un solo bloque o 2 × ${Math.round(s.z2/2)} min con 3 min suaves.`,'tempo']);
    else it.push([`Rodaje medio: <b>25 min</b> a <b>${rango(d,'z1a')}</b>.`,'rodaje']);
    it.push(['Recta final: 6 × 100 m progresivos con recuperación completa.','progres']);
    it.push('Vuelta a la calma 10 min en zona 1.');
    return {t:'Umbral · continuo intensivo', d:(s.z2+35)+' min', rpe:pl.rpe.umbral, it};
  }

  if(id==='vo2max'){
    if(s.tipo==='test') return {t:'Simulacro del TGCF', d:'75 min', rpe:pl.rpe.test, it:[
      ['Calentamiento completo de 15 min: 10 min en zona 1, movilidad y 4 progresivos.','calent'],
      ['Test en el orden habitual: flexo-extensiones (2 min) → plancha isométrica → CAV → 2.000 m, con las recuperaciones reales de la jornada.','cavCompleto'],
      [`Objetivo en los 2.000 m: <b>${fmtT(d.t2000Obj)}</b> (${ritmoTxt(d.ritmoObj)}), saliendo controlado los primeros 400 m.`,'carrera2000'],
      'Anota las marcas en «Mi test» y guárdalas en el historial: el plan se recalcula solo con ellas.',
      'Vuelta a la calma 10 min y estiramientos.']};
    const it=[['Calentamiento 12 min en zona 1, movilidad y 4 progresivos de 80 m.','calent']];
    if(s.vo2n) it.push([`Interválico extensivo largo: <b>${s.vo2n} × ${dur(s.vo2dur)}</b> a <b>${rango(d,'z3')}</b>
      (${Math.round(CFG.plan.zonas.z3[0]*100)}-${Math.round(CFG.plan.zonas.z3[1]*100)} % de tu VAM), recuperación <b>${dur(rec('z3'))}</b> trotando suave.`,'seriesLarg']);
    if(s.corn) it.push([`Interválico corto: <b>${s.corn} × ${dur(s.cordur)}</b> a <b>${rango(d,'z4')}</b>,
      recuperación <b>${dur(rec('z4'))}</b>. Ritmo constante en todas las repeticiones.`,'seriesCort']);
    if(!s.vo2n && !s.corn) it.push([`Continuo variable: <b>25 min</b> alternando 3 min a ${rango(d,'z3')} y 5 min a ${rango(d,'z1')}.`,'seriesLarg']);
    it.push('Vuelta a la calma 10 min en zona 1.');
    return {t:'Potencia aeróbica · series', d:'65 min', rpe:pl.rpe.vo2, it};
  }

  if(id==='rodajeCav') return {t:'Rodaje en zona 1 y agilidad', d:(s.z1+30)+' min', rpe:pl.rpe.rodaje, it:[
    [`Continuo extensivo: <b>${s.z1} min</b> a <b>${rango(d,'z1')}</b> (${pctFC(d,0.65)}–${pctFC(d,0.75)} lpm, RPE 11 de 20).
     Debes poder hablar durante todo el rodaje.`,'rodaje'],
    [`CAV completo: <b>${s.cav} recorridos</b> al 90 % con recuperación de ${dur(rec('cav'))}. Coloca tú la pelota antes de cada intento.`,'cavCompleto'],
    ['Técnica de cambio de dirección: 6 × (salida desde sentado + 15 m con giro de 180°) al máximo, recuperación completa.','cavSalidas'],
    'Movilidad y estiramientos 10 min.']};

  if(id==='velocidadCav'){
    const it=[['Calentamiento 12 min en zona 1 y técnica de carrera: skipping, talón-glúteo y zancada.','tecCarrera']];
    it.push([`Cambios de dirección: <b>${Math.max(3,Math.round(s.cav*0.8))} × 10 s</b> a intensidad máxima con estímulo visual del compañero,
      recuperación completa de ${dur(rec('cav'))}. Se busca calidad, no acumular fatiga.`,'cavCambios']);
    it.push([`Arrastres o trineo: <b>4 × 25 m</b> con el 5-12 % del peso corporal (${Math.round(70*0.05)}-${Math.round(70*0.12)} kg orientativos), recuperación completa.`,'arrastres']);
    it.push([`CAV cronometrado: <b>${Math.max(2,Math.round(s.cav*0.6))} recorridos</b> anotando el mejor tiempo. Objetivo: bajar de ${d.cavAct?dec1(Math.max(11.6,d.cavAct-0.3))+' s':'tu mejor marca'}.`,'cavCompleto']);
    if(s.corn) it.push([`Series cortas: <b>${Math.round(s.corn*0.6)} × ${dur(s.cordur)}</b> a <b>${rango(d,'z4')}</b>, recuperación ${dur(rec('z4'))}.`,'seriesCort']);
    it.push('Vuelta a la calma 10 min.');
    return {t:'Velocidad y cambios de dirección', d:'50 min', rpe:pl.rpe.cav, it};
  }
  return {t:id, d:'', it:[], rpe:5};
}

function generaPlan(){
  const d=datosPlan(), pl=CFG.plan, P=planActivo(), f=d.nivel.factor;
  const dias = Math.max(1, Math.min(planCfg.dias || P.dias, P.sesiones.length));
  const orden = P.sesiones.slice(0, dias);
  const semanas = P.semanasCfg.map(s0=>{
    const s = {...s0};
    /* regla de entrenamiento concurrente: si en la semana hay trabajo por
       encima del umbral, las series de fuerza bajan a 2-4 repeticiones */
    const altaIntensidad = (s.vo2n>0 || s.corn>0);
    s.repFuerza = altaIntensidad ? Math.min(4, Math.max(2, s.repFuerza)) : Math.min(8, Math.max(6, s.repFuerza));
    const nFlex = Math.max(3, Math.round(d.flexMax * Math.min(0.85, s.pctFlex*f)));
    const tPlan = Math.max(15, Math.round(d.planMax * Math.min(0.85, s.pctPlancha*f)/5)*5);
    const ceMax = s.repFuerza + (s.repFuerza<=4?2:3);   // repeticiones realizables: se dejan 2-3 sin hacer
    const ctx={s,d,nFlex,tPlan,pl,ceMax};
    const ses = orden.map(id=>sesion(id,ctx));
    const carga = ses.reduce((a,x)=>a+(x.rpe||5)*(parseInt(x.d)||50),0);
    return {...s, nFlex, tPlan, ceMax, altaIntensidad, ses, carga};
  });
  return {semanas, d, dias, P};
}

const vamLabel = m => m==='kmh'?'km/h':(m==='test6'?'Metros en 6 min':(m==='navette'?'Palier':(m==='t1000'?'Tiempo 1.000 m':'—')));

function avisoObjetivo(d){
  if(obj.modo==='apto' || !isFinite(d.mejora)) return '';
  if(d.mejora<=0) return `<div class="good">Tu marca actual de 2.000 m ya está por delante del objetivo: mantén el nivel y sube puntos en las otras pruebas.</div>`;
  const pct=Math.round(d.mejora*100);
  if(pct<=10) return '';
  /* qué nota es realista con una mejora del 8 % en doce semanas */
  const tReal=Math.round(d.t2000Act*0.92);
  const pCar=pr('carrera');
  const ptsReal=pCar?puntos(pCar,tReal,yo.sexo,yo.edad):null;
  return `<div class="mot">Tu objetivo exige bajar los 2.000 m un <b>${pct} %</b> (de ${fmtT(d.t2000Act)} a ${fmtT(d.t2000Obj)}).
    En doce semanas una mejora realista está entre el 5 y el 10 %. Con un 8 % llegarías a <b>${fmtT(tReal)}</b>${ptsReal!==null?`, que son <b>${ptsReal} puntos</b>`:''}.
    El plan sigue siendo válido —los ritmos se calculan sobre tu nivel de hoy, no sobre la meta—, pero plantéate un objetivo intermedio
    y vuelve a subirlo cuando repitas el test.</div>`;
}

function docMetodologia(){
  const pl=CFG.plan, a=CFG.autor||{};
  return `<details class="doc"><summary>Metodología del plan</summary><div class="in">
    ${a.nombre?`<p><b>Autoría.</b> Planes diseñados por <b>${esc(a.nombre)}</b>${a.titulo1?', '+esc(a.titulo1.charAt(0).toLowerCase()+a.titulo1.slice(1)):''}${a.titulo2?' y '+esc(a.titulo2.charAt(0).toLowerCase()+a.titulo2.slice(1)):''}.</p>`:''}
    <p><b>Estructura.</b> Doce semanas en tres bloques de cuatro: adaptación (1-4), desarrollo (5-8) y específico (9-11),
      con semanas de descarga en la 4 y la 8, puesta a punto en la 11 y simulacro del test en la 12. La carga sube dentro
      de cada bloque y cae en la descarga, y en la puesta a punto se recorta el volumen manteniendo la intensidad.</p>
    <p><b>Resistencia.</b> Se aplican los métodos continuo extensivo, continuo intensivo (umbral) e interválico extensivo largo
      con los parámetros de carga del modelo de Navarro. La distribución de intensidades arranca piramidal y termina polarizada:
      alrededor del <b>70-80 % del volumen en zona 1</b>, por debajo del primer umbral, porque es lo que sostiene la base aeróbica
      sobre la que rinde el trabajo intenso. Las series de ${pl.zonas.z3[0]*100}-${pl.zonas.z3[1]*100} % de la VAM en fracciones de
      3-4 minutos son el estímulo principal para el VO₂máx, que es el factor que decide una prueba de 2.000 m.</p>
    <p><b>Ritmos.</b> Todo se calcula sobre tu <b>VAM estimada</b>, deducida de la marca de 2.000 m corrigiendo por la fracción de VAM
      que se sostiene en ese tiempo. Cada zona se expresa en min/km y con su rango de pulsaciones, con la FC máxima estimada
      por la fórmula de Tanaka (208 − 0,7 × edad). Si te tomas las pulsaciones, manda la FC; si no, el ritmo.</p>
    <p><b>Fuerza.</b> Se programa por <b>carácter del esfuerzo</b>, la notación X(Y): repeticiones que haces sobre las que podrías hacer.
      Una serie de 4(6) son cuatro repeticiones con una dificultad que te permitiría seis. Nunca se llega al fallo, la velocidad de
      ejecución es siempre la máxima posible y las recuperaciones son completas. Para subir las repeticiones del test hay que subir
      la fuerza máxima: por eso se usan variantes lastradas o dificultadas, y las series del gesto del test se hacen con margen,
      no hasta el agotamiento. El trabajo isométrico de plancha se prescribe como porcentaje de tu tiempo máximo, cortando en cuanto
      se pierde la alineación.</p>
    <p><b>Entrenamiento concurrente.</b> Fuerza y resistencia interfieren entre sí, así que el plan respeta cuatro reglas:
      la sesión de fuerza va <b>antes</b> que la de resistencia si caen el mismo día y, a ser posible, en días distintos;
      cuando la resistencia no pasa del umbral, las series de fuerza son de <b>6-8 repeticiones</b>;
      cuando hay trabajo por encima del umbral, bajan a <b>2-4 repeticiones</b>; y en ningún caso se entrena con carácter del esfuerzo máximo.
      La resistencia es la prioridad y la fuerza el complemento que la sostiene.</p>
    <p><b>Velocidad y CAV.</b> Series de unos diez segundos a intensidad máxima con recuperación completa y estímulo visual,

function sparkline(notas){
  if(notas.length<2) return '<div class="hint">Guarda al menos dos registros para ver la gráfica de evolución.</div>';
  const W=600,H=120,P=22;
  const xs=(i)=>P+i*(W-2*P)/(notas.length-1);
  const ys=(v)=>H-P-(v/10)*(H-2*P);
  const pts=notas.map((h,i)=>[xs(i),ys(h.nota)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${[0,5,10].map(v=>`<line class="gr" x1="${P}" y1="${ys(v)}" x2="${W-P}" y2="${ys(v)}"/>
      <text x="2" y="${ys(v)+3}">${v}</text>`).join('')}
    <polyline class="ln" points="${pts.map(p=>p.join(',')).join(' ')}"/>
    ${pts.map(p=>`<circle class="pt" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`).join('')}
  </svg><div class="hint">Evolución de la nota: de ${fechaCorta(notas[0].fecha)} a ${fechaCorta(notas[notas.length-1].fecha)}.</div>`;
}

  $('tT').onchange=e=>{ tSel.tramo=e.target.value; vistaTablas(); };
}
function ajusteClave(p,m){
  const ks=clavesDe(p); if(!ks.length) return null;
  if(p.mejor==='mas'){ if(m>=ks[0]) return ks[0]; for(const k of ks) if(m>=k) return k; return null; }
  if(m<=ks[0]) return ks[0];
  let o=null; for(const k of ks){ if(m>=k) o=k; else break; } return o;
}

    <line x1="${X0}" y1="${Y-16}" x2="${X0}" y2="${Y+DY+16}"/>

  <path d="M${px(16)} ${Y+DY-8} L${px(0)} ${Y+DY-8}" fill="none" stroke="#fff" stroke-width="3"
        stroke-dasharray="7 6" stroke-linecap="round" opacity=".75"/>
  ${conoB.map(m=>cono(px(m),Y+DY)).join('')}
  ${conoA.map(m=>cono(px(m),Y)).join('')}
  <circle cx="${px(16)}" cy="${Y+DY/2}" r="7" fill="#fff"/>
  <circle cx="${px(0)}" cy="${Y+DY/2}" r="9" fill="none" stroke="#fff" stroke-width="3"/>
  <g fill="#c3cef0" font-size="11" font-weight="700" font-family="inherit">
    <text x="${X0-14}" y="${Y+DY/2+4}" text-anchor="end">P1</text>

    <text x="${(X0+X1)/2}" y="${Y+DY+40}" text-anchor="middle" fill="#9fb0dc">16 m entre P1 y P2 · segmentos de 2 m</text>
    <text x="${X0}" y="176" fill="var(--acc2)">— ida en eslalon</text>
    <text x="${X0+110}" y="176">- - vuelta a máxima velocidad</text>
    <text x="${X0+250}" y="176" fill="#fff">● pelota</text></g>
</svg>`;
})();

/* ==================================================================
   LOGROS
   ================================================================== */
function medallas(){
  const r=evaluar(yo), h=hist||[], usadas=r.usadas;
  const mejorNota = h.length?Math.max(...h.filter(x=>x.nota!==null).map(x=>x.nota).concat([r.completo?r.nota:0])):(r.completo?r.nota:0);
  const cienEn = usadas.filter(p=>r.pts[p.id]===100).length;
  const perfMin = r.perfil?Math.min(...r.perfil):0;
  const g = (typeof generaPlan==='function' && desbloqueado()) ? (()=>{ try{return generaPlan();}catch(e){return null;} })() : null;
  const semanasHechas = g ? g.semanas.filter(s=>s.ses.every((_,i)=>planCfg.hechas[claveSes(s.n,i)])).length : 0;
  const L=[
    {id:'primer',  ic:'✓', n:'Primer registro',    d:'Guarda tu primer test completo',      ok:h.length>=1,        pr:Math.min(1,h.length)},
    {id:'apto',    ic:'★', n:'Apto',               d:'Supera los '+CFG.minPuntos+' puntos en todas las pruebas', ok:r.apto===true||h.some(x=>x.apto), pr:r.apto?1:0},
    {id:'n5',      ic:'5', n:'Nota 5',             d:'Alcanza un 5 de nota',                ok:mejorNota>=5,       pr:Math.min(1,mejorNota/5)},
    {id:'n7',      ic:'7', n:'Nota 7',             d:'Alcanza un 7 de nota',                ok:mejorNota>=7,       pr:Math.min(1,mejorNota/7)},
    {id:'n9',      ic:'9', n:'Nota 9',             d:'Alcanza un 9 de nota',                ok:mejorNota>=9,       pr:Math.min(1,mejorNota/9)},
    {id:'perf5',   ic:'▲', n:'Perfil parejo',      d:'Un 5 o más en todas las cualidades',  ok:perfMin>=5,         pr:Math.min(1,perfMin/5)},
    {id:'perf7',   ic:'◆', n:'Perfil alto',        d:'Un 7 o más en todas las cualidades',  ok:perfMin>=7,         pr:Math.min(1,perfMin/7)},
    {id:'cien',    ic:'100',n:'Pleno en una prueba',d:'100 puntos en cualquier prueba',     ok:cienEn>=1,          pr:Math.min(1,cienEn)},
    {id:'const',   ic:'≡', n:'Constancia',         d:'Cinco registros en el historial',     ok:h.length>=5,        pr:Math.min(1,h.length/5)},
    {id:'sem4',    ic:'4', n:'Primer bloque',      d:'Completa 4 semanas del plan',         ok:semanasHechas>=4,   pr:Math.min(1,semanasHechas/4)},
    {id:'sem8',    ic:'8', n:'Segundo bloque',     d:'Completa 8 semanas del plan',         ok:semanasHechas>=8,   pr:Math.min(1,semanasHechas/8)},
    {id:'sem12',   ic:'⬢', n:'Plan completo',      d:'Completa las 12 semanas del plan',    ok:semanasHechas>=12,  pr:Math.min(1,semanasHechas/12)}
  ];
  return L;
}
function tiraMedallas(max){
  const L=medallas(), g=L.filter(m=>m.ok), lista=(max?L.slice(0,max):L);
  return `<div class="meds">${lista.map(m=>`
    <div class="med ${m.ok?'on':''}" title="${esc(m.d)}">
      <div class="mi">${m.ic}</div><div class="mn">${esc(m.n)}</div>
      ${m.ok?'':`<div class="mb"><i style="width:${Math.round(m.pr*100)}%"></i></div>`}
    </div>`).join('')}</div>
    <div class="hint">${g.length} de ${L.length} logros conseguidos.</div>`;
}
/* ==================================================================
   INICIO · panel de situación
   Aquí se lee el resultado y se decide qué hacer.
   Las marcas se introducen en «Mi test», no aquí.
   ================================================================== */
function diagnostico(r){
  if(!r.completo){
    const faltan=r.usadas.filter(p=>r.pts[p.id]===null);
    return {t:'Completa tu test',
      d:`Te ${faltan.length===1?'falta la marca de':'faltan las marcas de'} <b>${faltan.map(p=>esc(p.corto)).join(', ')}</b>
         para saber tu nota y tu perfil.`,
      b:'Introducir marcas', v:'test'};
  }
  if(!r.apto) return {t:'Aún no llegas al apto',
    d:`No alcanzas los ${CFG.minPuntos} puntos en <b>${r.fallos.map(p=>esc(p.nombre)).join(', ')}</b>.
       Es donde tienes que meter el trabajo antes que en ninguna otra cosa.`,
    b:'Ver qué marca necesitas', v:'obj'};
  const flojo=r.usadas.slice().sort((a,b)=>r.pts[a.id]-r.pts[b.id])[0];
  const margen=100-r.pts[flojo.id];
  const objPts = obj.modo==='apto'?CFG.minPuntos:Math.ceil(obj.nota*CFG.escala);
  const total=r.usadas.reduce((a,p)=>a+r.pts[p.id],0), falta=Math.max(0,objPts*r.usadas.length-total);
  return {t:'Por dónde vas a ganar puntos',
    d:`Tu prueba más floja es <b>${esc(flojo.nombre)}</b> con ${r.pts[flojo.id]} puntos: ahí te quedan ${margen} por ganar,
       más que en ninguna otra. ${obj.modo==='apto'
        ? 'Ya tienes el apto asegurado.'
        : (falta>0?`Para tu objetivo de ${obj.nota.toFixed(1).replace('.',',')} te faltan <b>${falta} puntos</b> en total.`
                  :'Ya has alcanzado tu objetivo: súbelo y sigue.')}`,
    b:falta>0?'Ver mi objetivo':'Cambiar mi objetivo', v:'obj'};
}

  ${r.completo?`<div class="card"><h2><span class="num">1</span>Tu perfil físico</h2>
    <div class="perfil">${r.perfil.map((n,i)=>`<div><b>${n}</b><span>${esc(et[i]||'')}</span></div>`).join('')}</div>
    <div class="hint">Cada cifra es la decena de puntos de esa cualidad. El mínimo para ser apto es
      ${CFG.cualidades.map(()=>Math.floor(CFG.minPuntos/CFG.escala)).join('.')}.</div>
  </div>`:''}

  <div class="card"><h2><span class="num">${r.completo?'2':'1'}</span>${esc(dg.t)}</h2>
    <div style="font-size:13.5px;line-height:1.6">${dg.d}</div>
    <div class="row" style="margin-top:12px">

      ${r.completo?`<button class="btn" onclick="setVista('sim')">Simular una marca</button>`:''}
    </div>
  </div>

  ${prox?`<div class="card"><h2><span class="num">${r.completo?'3':'2'}</span>Tu próxima sesión</h2>
    <div class="prox" onclick="setVista('plan')">

        <div class="hint" style="margin-top:2px">Semana ${prox.s.n} · ${esc(prox.s.fase)} · ${esc(prox.ses.d)} · RPE ${prox.ses.rpe}/10</div>
      </div>
      <div class="pgo">›</div>
    </div>
    <div class="hint">${esc(g.P.nombre)} · ${cuentaHechas(g.P.id)} de ${g.semanas.length*g.dias} sesiones completadas.</div>
  </div>`:(APP.plan && CFG.plan.activo?`<div class="card"><h2><span class="num">${r.completo?'3':'2'}</span>Plan de entrenamiento</h2>
    <div class="prox" onclick="setVista('plan')">
      <div class="pw">12</div>
      <div style="flex:1;min-width:0"><div class="pt2">Doce semanas hechas a tu medida</div>
        <div class="hint" style="margin-top:2px">${CFG.planes.length} planes según tu nivel y tu objetivo</div></div>
      <div class="pgo">›</div></div>
  </div>`:(APP.promoApp?`<div class="card"><h2><span class="num">${r.completo?'3':'2'}</span>Planes de entrenamiento</h2>
    <div style="font-size:13.5px;line-height:1.6">Doce semanas hechas a la medida de tus marcas, con seis planes según tu nivel
      y tu objetivo, ritmos personales y fichas de técnica. Están en la aplicación de Android.</div>
    <div class="row" style="margin-top:12px"><a class="btn p" href="${esc(APP.promoApp)}" target="_blank" rel="noopener"
      style="text-decoration:none;text-align:center">Ver la aplicación</a></div>
  </div>`:''))}

  <div class="card"><h2><span class="num">★</span>Logros <span style="margin-left:auto;font-size:11px;color:var(--acc2)">${logrados} de ${med.length}</span></h2>

}
